<body class="bg-background text-on-background min-h-screen flex flex-col antialiased"><header class="border-b border-outline/20 bg-surface">

</div>
<!-- Multimedia/Status Icons -->

<button aria-label="Notifications" class="hover:text-honey-accent transition-colors">
<span class="material-symbols-outlined text-[22px]">notifications</span>
</button>
<button aria-label="User Profile" class="hover:text-honey-accent transition-colors">
<span class="material-symbols-outlined text-[22px]">account_circle</span>
</button>
</div>
</div>
</header>

</div>
<div class="relative w-full md:w-2/5 flex flex-col justify-center px-8 md:px-16 lg:px-24 py-12 md:py-24 bg-background md:bg-transparent z-10">

<div class="space-y-4">
<p class="font-label-caps text-label-caps text-honey-accent uppercase tracking-widest">Welcome Home</p>
<h1 class="font-display-serif text-display-serif text-on-surface leading-tight">
          What are you cooking for them this week?
        </h1>
<p class="font-body-main text-body-main text-on-surface-variant max-w-sm mt-4">
          Sign in to access your family's weekly briefs, relational memories, and trusted recipes.
        </p>
</div>
<div class="flex flex-col gap-6">
<button class="w-full min-h-[56px] bg-surface-container border border-outline-variant hover:border-outline text-on-surface font-label-caps text-label-caps uppercase tracking-widest rounded-lg flex items-center justify-center gap-3 transition-colors" type="button">

<form class="flex flex-col gap-6 mt-6" onsubmit="event.preventDefault();">

</div>
</div>
<div class="relative flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-2 ml-1" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline-variant">lock</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-3 pl-12 pr-12 font-body-main text-body-main text-on-surface placeholder:text-outline focus:outline-none focus:border-honey-accent focus:ring-1 focus:ring-honey-accent transition-colors bg-opacity-80 backdrop-blur-sm" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-outline-variant hover:text-on-surface transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
</div>
<div class="flex flex-col gap-4 mt-2">
<button class="w-full min-h-[56px] bg-honey-accent hover:bg-amber text-warm-neutral-900 font-label-caps text-label-caps uppercase tracking-widest rounded-lg flex items-center justify-center gap-2 transition-colors" type="submit">
<span class="">Enter Kitchen</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<button class="w-full min-h-[44px] bg-transparent border border-outline-variant hover:border-outline text-on-surface font-label-caps text-label-caps uppercase tracking-widest rounded-lg transition-colors" type="button">
            Create Account

</div>
