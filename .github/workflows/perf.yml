name: Perf — Lighthouse CI (anchor device)

on:
  pull_request:
    branches: [main]

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build apps (VITE_E2E mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: '9.15.0'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build apps/web
        run: pnpm --filter @hivekitchen/web build
        env:
          VITE_E2E: 'true'
          # Missing Supabase envs throw at module import (supabase-client.ts)
          # and kill the bundle before boot — same stubs as ci.yml's E2E job.
          VITE_API_BASE_URL: 'http://localhost:3001'
          VITE_SSE_BASE_URL: 'http://localhost:3001'
          VITE_SUPABASE_URL: 'https://stub-e2e.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'stub-anon-key-for-e2e'

      - name: Build apps/marketing
        run: pnpm --filter @hivekitchen/marketing build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist/

      - uses: actions/upload-artifact@v7
        with:
          name: marketing-dist
          path: apps/marketing/dist/

  # LHCI thresholds (apps/*/lighthouserc.json) are RATCHETS, not aspirations:
  # hard "error" floors sit just under the current measured scores so any
  # regression fails, while known gaps stay visible as "warn" (web
  # color-contrast, marketing meta-description, metric budgets). When the
  # web bundle gets code-split, raise categories:performance accordingly.
  # Baseline 2026-07-05: web perf 0.67 / a11y 0.90; the old config asserted
  # 0.95 everywhere plus a preset that failed on informational audits — red
  # on every branch since June with zero signal.
  lhci-web:
    name: Perf / apps/web LHCI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: '9.15.0'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist/

      - name: Run LHCI
        run: pnpm exec lhci autorun
        working-directory: apps/web

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lhci-reports-web
          path: apps/web/.lighthouseci/
          retention-days: 30

  lhci-marketing:
    name: Perf / apps/marketing LHCI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: '9.15.0'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: marketing-dist
          path: apps/marketing/dist/

      - name: Run LHCI
        run: pnpm exec lhci autorun
        working-directory: apps/marketing

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lhci-reports-marketing
          path: apps/marketing/.lighthouseci/
          retention-days: 30

  sse-timing:
    name: Perf / SSE invalidation timing
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: '9.15.0'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
        working-directory: apps/web

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/web/dist/

      - name: SSE timing test
        run: pnpm exec playwright test test/perf/sse-invalidation.spec.ts
        working-directory: apps/web
