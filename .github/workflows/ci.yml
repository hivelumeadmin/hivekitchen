name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Contracts · Manifest
    runs-on: ubuntu-latest
    env:
      # Turborepo remote cache (Vercel free tier).
      # Set TURBO_TOKEN (secret) and TURBO_TEAM (var) in GitHub repo settings to enable.
      # If unset, Turbo falls back to local cache — no failure.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: '9.15.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Contracts check
        run: pnpm contracts:check

      - name: Tool manifest check
        run: pnpm tools:check

      - name: Dead code check (knip)
        run: pnpm deadcode:check
        # Adjudicated exceptions live in knip.json (operational scripts as
        # entries, deliberate contract aliases, dynamic tool-manifest exports
        # tagged @public). A failure here means NEW dead code — delete it or,
        # if it's deliberate, record the exception in knip.json with a reason.

      - name: Sacred-channel boundary check
        run: pnpm --filter @hivekitchen/api check:sacred-channel

  e2e:
    name: E2E · A11y
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: '9.15.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
        working-directory: apps/web

      - name: Build apps/web (VITE_E2E mode)
        run: pnpm --filter @hivekitchen/web build
        env:
          # The e2e specs drive the app through test hooks (__lumiStore,
          # __hivekitchen_qc) that are compiled in only when VITE_E2E=true —
          # locally this comes from apps/web/.env.local.
          VITE_E2E: 'true'
          # supabase-client.ts constructs its client at module import; missing
          # values throw "supabaseUrl is required" and kill the whole bundle
          # before the test hooks install. Specs mock all network traffic, so
          # stub values are sufficient — nothing is ever contacted.
          VITE_API_BASE_URL: 'http://localhost:3001'
          VITE_SSE_BASE_URL: 'http://localhost:3001'
          VITE_SUPABASE_URL: 'https://stub-e2e.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'stub-anon-key-for-e2e'

      - name: E2E + A11y tests
        run: pnpm exec playwright test test/e2e --max-failures=10 --workers=100%
        timeout-minutes: 25
        # Scoped to test/e2e — the SSE perf spec (test/perf) runs in perf.yml
        # (Story 1.13), not here. The original invocation used vitest-only
        # flags (--passWithNoTests / --ignore-glob) that Playwright rejects;
        # it was written before any e2e specs existed and had never run
        # (this job was skipped for months behind a red lint gate).
        working-directory: apps/web

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  db-diff:
    name: DB schema drift check
    runs-on: ubuntu-latest
    needs: [quality]
    # Full supabase db diff (supabase start + db reset + diff) is wired in Epic 2
    # when the Supabase project is linked and Docker is configured in CI.
    # For now this job verifies the Supabase CLI installs correctly and the migrations
    # directory structure is intact on every push/PR.
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: '2.0.0'

      - name: Verify Supabase CLI and migration files
        run: |
          supabase --version
          echo "Migration files present:"
          ls supabase/migrations/ || echo "(none)"
          # Full supabase db diff (requires supabase start + Docker) is wired in Epic 2
          # when the Supabase project is linked and CI has Docker available.
