<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HiveKitchen — Onboarding Rebuild · Rough Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1714; --surface:#232019; --surface-2:#2c281f; --surface-3:#363023;
    --fg:#f4efe6; --fg-muted:#a59c8c; --border:#3a352c;
    --amber:#D98F3C; --amber-warm:#E8A24E;
    --lumi-terracotta:#C97B5A; --lumi-terracotta-warmed:#D98E6E;
    --sacred-plum:#8A6E94; --foliage:#7C9A6B; --safety-teal:#5FA8A0; --safety-red:#C25B4E;
    --r-sm:6px; --r-md:10px; --r-lg:16px; --r-xl:24px;
    --serif:'Instrument Serif',Georgia,serif; --sans:'Public Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3,.serif{font-family:var(--serif);font-weight:400}

  /* chrome */
  .chrome{position:sticky;top:0;z-index:50;background:rgba(26,23,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .chrome .in{max-width:1080px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px;height:54px}
  .brand{font-family:var(--serif);font-size:19px;color:var(--amber)}
  .steps{display:flex;gap:5px;margin-left:8px}
  .step{font:inherit;font-size:12px;font-weight:600;color:var(--fg-muted);background:transparent;border:1px solid var(--border);border-radius:999px;padding:5px 12px;cursor:pointer}
  .step[aria-current="true"]{color:var(--bg);background:var(--amber);border-color:var(--amber)}
  .nav{margin-left:auto;display:flex;gap:8px}
  .nav button{font:inherit;font-size:13px;font-weight:600;border-radius:var(--r-md);padding:7px 14px;cursor:pointer;border:1px solid var(--border);background:var(--surface-3);color:var(--fg)}
  .nav button:disabled{opacity:.35;cursor:default}

  /* progress strip */
  .prog{max-width:1080px;margin:0 auto;padding:18px 20px 0;display:flex;align-items:center;gap:10px;color:var(--fg-muted);font-size:12px;font-weight:600}
  .bar{flex:1;height:4px;background:var(--surface-3);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--amber);transition:width .4s}

  /* two-col onboarding */
  .ob{max-width:1080px;margin:0 auto;padding:24px 20px 60px;display:grid;grid-template-columns:0.9fr 1.1fr;gap:32px;min-height:70vh}
  @media(max-width:880px){.ob{grid-template-columns:1fr}}

  /* conversation column */
  .convo{padding-top:10px}
  .glyph{display:flex;gap:3px;align-items:flex-end;height:22px;margin-bottom:16px}
  .glyph span{width:3px;background:var(--lumi-terracotta);border-radius:2px;animation:wave 1.1s ease-in-out infinite}
  .glyph span:nth-child(1){height:8px}.glyph span:nth-child(2){height:18px;animation-delay:.1s}
  .glyph span:nth-child(3){height:12px;animation-delay:.2s}.glyph span:nth-child(4){height:22px;animation-delay:.3s}
  .glyph span:nth-child(5){height:10px;animation-delay:.4s}
  @keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
  .q{font-family:var(--serif);font-size:32px;line-height:1.16;margin:0 0 18px}
  .sub{color:var(--fg-muted);font-size:14px;margin-bottom:18px;max-width:46ch}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-size:13px;font-weight:600;border:1px solid var(--border);background:var(--surface-3);color:var(--fg);border-radius:999px;padding:7px 13px;cursor:pointer}
  .chip.sel{border-color:var(--amber);color:var(--amber);background:rgba(217,143,60,.1)}
  .chip.hint{border-style:dashed;color:var(--fg-muted);background:transparent;cursor:default}
  .input{display:flex;gap:8px;align-items:flex-end;max-width:480px}
  .input textarea{flex:1;resize:none;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);color:var(--fg);font:inherit;font-size:14px;padding:11px 13px;height:46px}
  .send{flex:none;width:46px;height:46px;border-radius:50%;border:none;background:var(--amber);color:#241712;font-size:18px;cursor:pointer}
  .userecho{align-self:flex-end;max-width:80%;margin:10px 0 4px;background:var(--lumi-terracotta);color:#241712;border-radius:14px;border-bottom-right-radius:4px;padding:9px 13px;font-size:14px;width:fit-content;margin-left:auto}
  .note{font-size:12px;color:var(--fg-muted);margin-top:18px;border-left:2px solid var(--border);padding-left:12px;max-width:48ch}
  .note b{color:var(--fg)}

  /* entry (step 0) */
  .entry{text-align:center;padding-top:40px}
  .orbBig{width:96px;height:96px;border-radius:50%;margin:0 auto 26px;background:radial-gradient(circle at 35% 30%,var(--lumi-terracotta-warmed),var(--lumi-terracotta));box-shadow:0 0 50px rgba(201,123,90,.55);animation:breathe 3.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .entry .q{font-size:38px}
  .entry .actions{display:flex;gap:12px;justify-content:center;margin-top:24px}
  .btn{font:inherit;font-weight:600;font-size:15px;border-radius:var(--r-md);padding:13px 22px;cursor:pointer;border:1px solid transparent;display:inline-flex;gap:8px;align-items:center}
  .btn.primary{background:var(--fg);color:var(--bg)}
  .btn.ghost{background:transparent;color:var(--fg);border-color:var(--border)}

  /* KITCHEN MAP — the hero */
  .map{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:22px;position:relative}
  .map .live{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--amber);margin-bottom:6px;text-transform:uppercase}
  .map .live .d{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:breathe 2s infinite}
  .map .kname{font-family:var(--serif);font-size:26px;margin:2px 0 4px}
  .map h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);margin:18px 0 9px;font-family:var(--sans);font-weight:700;display:flex;align-items:center;gap:8px}
  .map h3 .ok{color:var(--safety-teal)}
  .card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:11px}
  .card .av{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#241712}
  .card .nm{font-weight:600}.card .cs{font-size:12px;color:var(--fg-muted)}
  .safetypill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--safety-teal);background:rgba(95,168,160,.12);border:1px solid rgba(95,168,160,.32);border-radius:999px;padding:6px 12px;margin:0 7px 7px 0}
  .tastepill{display:inline-flex;font-size:13px;font-weight:600;color:var(--fg);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:6px 12px;margin:0 7px 7px 0}
  .ghost{opacity:.45;font-style:italic;font-size:13px;color:var(--fg-muted)}
  .land{animation:land .55s ease}
  @keyframes land{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .hide{display:none}

  /* recognition / summary */
  .glow{box-shadow:0 0 0 1px var(--amber),0 0 40px rgba(217,143,60,.25);animation:pulseGlow 2.4s ease-in-out infinite}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 0 1px var(--amber),0 0 30px rgba(217,143,60,.18)}50%{box-shadow:0 0 0 1px var(--amber),0 0 50px rgba(217,143,60,.32)}}
  .playback{font-family:var(--serif);font-size:22px;line-height:1.4}
  .playback .hl{color:var(--amber)}
</style>
</head>
<body>

<div class="chrome">
  <div class="in">
    <span class="brand">HiveKitchen · onboarding concept</span>
    <div class="steps">
      <button class="step" data-n="0" aria-current="true">Start</button>
      <button class="step" data-n="1">M1 · Family</button>
      <button class="step" data-n="2">M2 · Safety</button>
      <button class="step" data-n="3">M3 · Taste</button>
      <button class="step" data-n="4">Ready</button>
    </div>
    <div class="nav"><button id="prev" disabled>← Back</button><button id="next">Next →</button></div>
  </div>
</div>

<div class="prog"><span id="ptxt">Welcome</span><div class="bar"><i id="pbar" style="width:6%"></i></div></div>

<div class="ob">
  <!-- ============ LEFT: CONVERSATION ============ -->
  <div class="convo" id="convo"><!-- filled by JS --></div>

  <!-- ============ RIGHT: KITCHEN MAP (accumulates) ============ -->
  <div class="map" id="map">
    <span class="live"><span class="d"></span>Building as we talk…</span>
    <div class="kname" id="kname"><span class="ghost">Your kitchen…</span></div>

    <h3 id="h-fam" class="hide">Family</h3>
    <div id="fam"></div>

    <h3 id="h-safe" class="hide">Keeping safe <span class="ok" id="safeok"></span></h3>
    <div id="safe"></div>

    <h3 id="h-taste" class="hide">How your kitchen tastes</h3>
    <div id="taste"></div>

    <h3 id="h-later" class="hide">The bag &amp; your week</h3>
    <div id="later" class="hide"><span class="ghost">Lumi learns these as you cook the first week — no interview wall.</span></div>
  </div>
</div>

<script>
const convo=document.getElementById('convo');
const pbar=document.getElementById('pbar'), ptxt=document.getElementById('ptxt');
const kname=document.getElementById('kname');
const fam=document.getElementById('fam'), safe=document.getElementById('safe'), taste=document.getElementById('taste');
const show=id=>document.getElementById(id).classList.remove('hide');

// ---- conversation content per step ----
const SCREENS=[
 {p:6,t:'Welcome',html:`
   <div class="entry">
     <div class="orbBig"></div>
     <div class="q">Hi — I'm Lumi.<br>Let's set up your kitchen together.</div>
     <div class="sub" style="margin:0 auto;max-width:38ch">I'll ask a few things, then build you a week. You can talk or type — switch anytime, you won't lose your place.</div>
     <div class="actions"><button class="btn primary">◍ Start with voice</button><button class="btn ghost">⌨ I'd rather type</button></div>
   </div>
   <p class="note">One continuous session. Voice and text share the <b>same thread + Kitchen Map</b> — start talking, finish typing, nothing resets.</p>`},

 {p:28,t:'Moment 1 of 5 · who’s at the table',html:`
   <div class="glyph"><span></span><span></span><span></span><span></span><span></span></div>
   <div class="q">Who am I cooking for?</div>
   <div class="sub">Tell me the kids by name and age — I'll keep each of them in mind.</div>
   <div class="userecho">Maya's 7, and Sam is 4</div>
   <div class="chips"><span class="chip hint">…add another child</span><span class="chip hint">…just one for now</span></div>
   <div class="input"><textarea placeholder="Tell Lumi…"></textarea><button class="send">↑</button></div>
   <p class="note">Broad question → <b>hint chips</b> (illustrative, not buttons). The family lands on the map as you speak.</p>`},

 {p:50,t:'Moment 2 of 5 · keeping it safe',html:`
   <div class="glyph"><span></span><span></span><span></span><span></span><span></span></div>
   <div class="q">Now the part I never get wrong: anything I must keep out of every plan?</div>
   <div class="sub">This is the one thing I need before your first week. Tap any that apply, or tell me.</div>
   <div class="chips"><span class="chip sel">Peanuts</span><span class="chip">Tree nuts</span><span class="chip sel">Dairy</span><span class="chip">Egg</span><span class="chip">Shellfish</span><span class="chip">Sesame</span><span class="chip">Nothing — we're clear</span></div>
   <div class="input"><textarea placeholder="e.g. Sam reacts to dairy…"></textarea><button class="send">↑</button></div>
   <p class="note"><b>Narrow safety decision → choice chips</b> (multi-select). This is the only required moment — fail-closed guardrail keeps every future plan safe.</p>`},

 {p:74,t:'Moment 3 of 5 · how your kitchen tastes',html:`
   <div class="glyph"><span></span><span></span><span></span><span></span><span></span></div>
   <div class="q">What does dinner usually taste like at yours?</div>
   <div class="sub">Just a feel — I'll learn the details as we cook together.</div>
   <div class="userecho">Lots of rice and noodles, Maya loves anything orange, Sam likes things soft</div>
   <div class="chips"><span class="chip sel">East-Asian</span><span class="chip sel">Mild spice</span><span class="chip">Veg-forward</span><span class="chip">Halal</span></div>
   <div class="input"><textarea placeholder="Tell Lumi…"></textarea><button class="send">↑</button></div>
   <p class="note">After safety, the rest is <b>low-stakes</b>. You can stop here and still get a plan — taste, bag &amp; schedule keep filling over week one.</p>`},

 {p:100,t:'Your kitchen, ready',html:`
   <div class="glyph"><span></span><span></span><span></span><span></span><span></span></div>
   <div class="playback">So — here's your kitchen. <span class="hl">Maya, 7</span>, loves anything orange; <span class="hl">Sam, 4</span>, soft textures. <span class="hl">No peanuts, no dairy</span> — ever. East-Asian, mild, lots of rice.<br><br>Did I get you right?</div>
   <div class="chips" style="margin-top:22px"><span class="chip">Tweak something</span></div>
   <div class="actions" style="display:flex;gap:12px;margin-top:14px"><button class="btn primary">Show me my first week →</button></div>
   <p class="note">Ends on a <b>recognition moment</b>, not a "Finalize" button — Lumi plays back what it understood and the honey-glow fires on the map. CTA is the payoff, not a form submit.</p>`},
];

function render(n){
  convo.innerHTML=SCREENS[n].html;
  pbar.style.width=SCREENS[n].p+'%'; ptxt.textContent=SCREENS[n].t;
  document.querySelectorAll('.step').forEach(s=>s.setAttribute('aria-current', +s.dataset.n===n));
  document.getElementById('prev').disabled=n===0;
  document.getElementById('next').disabled=n===SCREENS.length-1;

  // ----- accumulate the KITCHEN MAP -----
  if(n>=1){ kname.innerHTML="Ada's Kitchen"; }
  else kname.innerHTML='<span class="ghost">Your kitchen…</span>';

  if(n>=1){ show('h-fam');
    fam.innerHTML=`<div class="card land"><div class="av" style="background:var(--foliage)">M</div><div><div class="nm">Maya</div><div class="cs">7 years old</div></div></div>
                   <div class="card land"><div class="av" style="background:var(--lumi-terracotta)">S</div><div><div class="nm">Sam</div><div class="cs">4 years old</div></div></div>`;
  } else { fam.innerHTML=''; document.getElementById('h-fam').classList.add('hide'); }

  if(n>=2){ show('h-safe'); document.getElementById('safeok').textContent='✓ cleared on every plan';
    safe.innerHTML=`<div class="land"><span class="safetypill">✓ No peanuts</span><span class="safetypill">✓ No dairy</span></div>`;
  } else { safe.innerHTML=''; document.getElementById('h-safe').classList.add('hide'); }

  if(n>=3){ show('h-taste');
    taste.innerHTML=`<div class="land"><span class="tastepill">🍚 Rice &amp; noodles</span><span class="tastepill">🥕 Maya · orange veg</span><span class="tastepill">🥄 Sam · soft</span><span class="tastepill">East-Asian · mild</span></div>`;
    show('h-later'); show('later');
  } else { taste.innerHTML=''; document.getElementById('h-taste').classList.add('hide'); document.getElementById('h-later').classList.add('hide'); document.getElementById('later').classList.add('hide'); }

  document.getElementById('map').classList.toggle('glow', n===SCREENS.length-1);
}

document.getElementById('next').onclick=()=>{const c=+document.querySelector('[aria-current="true"]').dataset.n; if(c<SCREENS.length-1) render(c+1);};
document.getElementById('prev').onclick=()=>{const c=+document.querySelector('[aria-current="true"]').dataset.n; if(c>0) render(c-1);};
document.querySelectorAll('.step').forEach(s=>s.onclick=()=>render(+s.dataset.n));
render(0);
</script>
</body>
</html>
